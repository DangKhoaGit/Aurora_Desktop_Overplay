name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: Aurora_Desktop_Overplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Aurora_Desktop_Overplay/global.json
          cache: true
          cache-dependency-path: 'Aurora_Desktop_Overplay/**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=release-tests.trx"
      - name: Build portable package and installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          ./build/Publish.ps1 -Version $version -BuildInstaller
      - name: Smoke test published executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./artifacts/publish/win-x64/AuroraDesktopOverlay.exe -ArgumentList '--smoke-test' -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Smoke test failed with exit code $($process.ExitCode)."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraDesktopOverlay-${{ github.ref_name }}
          path: Aurora_Desktop_Overplay/artifacts/release/*
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            > **Unsigned release:** Aurora Desktop Overlay v0.1.0 is not code-signed, so Windows SmartScreen may show a warning.

            Download artifacts only from this official repository. Verify each download against its accompanying `.sha256` file before running it. The corresponding GPL-3.0 source is preserved by this release tag.
          files: Aurora_Desktop_Overplay/artifacts/release/*

