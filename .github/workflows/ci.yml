name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Aurora_Desktop_Overplay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: Aurora_Desktop_Overplay/global.json
          cache: true
          cache-dependency-path: 'Aurora_Desktop_Overplay/**/packages.lock.json'
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
      - run: dotnet publish src/Aurora.Desktop.Overlay.App/Aurora.Desktop.Overlay.App.csproj -c Release -r win-x64 --self-contained true --no-restore -p:PublishSingleFile=true -p:PublishTrimmed=false -o artifacts/ci-publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: 'Aurora_Desktop_Overplay/**/TestResults/**'

